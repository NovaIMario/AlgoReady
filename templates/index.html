<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlgoReady</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<nav>
    <div class="logo">ALGO<span>READY</span></div>
    <div class="nav-links">
        <a href="/">Problems</a>
    </div>
</nav>

<div class="hero">
    <div class="hero-badge">// competitive programming</div>
    <h1>Train smarter.<br><span>Get hired.</span></h1>
    <p class="hero-sub">Search Codeforces problems, practice in the editor, get AI hints</p>
</div>

<div class="search-section">
    <div class="search-card">
        <div class="search-row">

            <div class="field autocomplete">
                <label>Problem Name</label>
                <input type="text" id="name" placeholder="Any name" autocomplete="off">
                <div class="dropdown" id="name-dropdown" style="display:none"></div>
            </div>

            <div class="field autocomplete">
                <label>Rating</label>
                <input type="text" id="rating" placeholder="Any rating" autocomplete="off">
                <div class="dropdown" id="rating-dropdown" style="display:none"></div>
            </div>

            <div class="field autocomplete">
                <label>Tag</label>
                <input type="text" id="tag" placeholder="Any tag" autocomplete="off">
                <div class="dropdown" id="tag-dropdown" style="display:none"></div>
            </div>

            <button onclick="search()">Search →</button>

        </div>
    </div>
</div>

<div id="results-section" style="display:none">
    <div class="results-header">
        <span class="results-count" id="results-count"></span>
    </div>
    <div id="results" class="results-grid"></div>
    <div id="load-more-wrap" style="display:none">
        <button id="prev-btn" class="nav-btn" onclick="prevPage()">← Prev</button>
        <span id="page-info" class="page-info"></span>
        <button id="next-btn" class="nav-btn" onclick="nextPage()">Next →</button>
    </div>
</div>

<div id="empty" class="empty-state" style="display:none">
    <div class="empty-icon">∅</div>
    <p>No problems found. Try different filters.</p>
</div>

<div id="error" class="error-state" style="display:none">
    <p>Failed to fetch problems. Check your connection.</p>
</div>

<script>
    const CF_TAGS = {{ cf_tags | tojson }};
    const NAMES   = {{ names   | tojson }};
    const RATINGS = {{ ratings | tojson }};
</script>
<script src="/static/script.js"></script>
</body>
</html>
